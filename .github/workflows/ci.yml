name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # v1, read-only, for the v1 ⇄ v2 parity suite (tools/fixtures/src/v1-parity.test.ts).
      - run: git clone --quiet https://github.com/mja8291/tcf.git reference && git -C reference checkout --quiet 0a4a75c
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -- --repeat-each=3 --retries=0
        working-directory: apps/web
